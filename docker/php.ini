; Configurare pentru mediul de dezvoltare
; In productie erorile se scriu in log, nu pe ecran
display_errors = On
error_reporting = E_ALL
log_errors = On

; validate_timestamps=1 => modificarile se vad la refresh, fara restart
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Nu anuntam versiunea PHP in headerele de raspuns
expose_php = Off

upload_max_filesize = 8M
post_max_size = 10M
date.timezone = Europe/Bucharest

; Protectie de baza a sesiunii: cookie inaccesibil din JS, trimis doar
; same-site, si refuzul id-urilor de sesiune inventate de client
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
