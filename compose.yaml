services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy serveste direct fisierele statice, deci ii ajunge doar public/
      - ./public:/var/www/html/public:ro
      - ./data/caddy:/data
    depends_on:
      - php

  php:
    build: ./docker
    restart: unless-stopped
    # Fara port expus: doar Caddy vorbeste cu PHP-FPM, in reteaua interna
    volumes:
      # Codul e montat, nu copiat: editarea locala se vede imediat in container
      - .:/var/www/html
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    # Fara port expus: baza de date se vede doar din reteaua containerelor
    environment:
      # Fara locale, clientul mysql din imagine porneste pe latin1 si
      # strica encoding-ul diacriticelor la incarcarea datelor
      LANG: C.UTF-8
      TZ: Europe/Bucharest
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
